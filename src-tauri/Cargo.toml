[package]
name = "opentag"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "opentag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-document-access = { path = "../crates/document-access" }
tag-core = { path = "../crates/tag-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
encoding_rs = "0.8"
tempfile = "3"
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1"
uuid = { version = "1", features = ["v4"] }
# Tag sources: rustls with the ring provider and bundled roots (no OpenSSL or
# platform verifier initialisation), so every desktop and mobile target builds.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tokio = { version = "1", features = ["sync", "time"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
trash = "5"
