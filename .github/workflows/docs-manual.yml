name: Publish docs manually

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.workflow_ref == format('{0}/.github/workflows/docs-manual.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NO_MKDOCS_2_WARNING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the documentation toolchain
        run: python -m pip install -r docs/site-requirements.txt
      - name: Build the guide
        run: python -m mkdocs build --strict
      - name: Set the custom domain
        run: echo 'taggroove.neerdael.nl' > build/user-guide-site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/user-guide-site

  deploy:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.workflow_ref == format('{0}/.github/workflows/docs-manual.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: opentag-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify main before deployment
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$GITHUB_SHA" = "$current_sha" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Skip an older revision; trigger a new manual docs run for current main.'
          fi
      - uses: actions/deploy-pages@v4
        if: steps.source.outputs.current == 'true'
        id: deployment
