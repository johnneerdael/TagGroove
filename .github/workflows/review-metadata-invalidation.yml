name: Review metadata invalidation
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited, review_requested, converted_to_draft]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: opentag-review-invalidation-${{ github.event.pull_request.number || github.event.issue.number }}
  queue: max
  cancel-in-progress: false
jobs:
  invalidate:
    # Lifecycle changes can select a SHA with another PR's green statuses.
    # Base edits belong here; description edits stay with the notes controller.
    # Ordinary discussion skips this metadata job.
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.action != 'edited' || github.event.changes.base)) ||
      (github.event.issue.pull_request &&
      (contains(github.event.comment.body, '@codex') ||
       contains(github.event.changes.body.from, '@codex') ||
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Withdraw stale approval without dispatching builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/review_gate.py invalidate-metadata
