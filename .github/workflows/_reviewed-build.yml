name: Reviewed pre-merge checks
on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      merge_sha:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  authorize:
    if: github.workflow_ref == format('{0}/.github/workflows/reviewed-pr.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.review.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Recheck live review and immutable merge before executing PR code
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ inputs.head_sha }}
          PR_BASE: ${{ inputs.base_sha }}
          PR_MERGE: ${{ inputs.merge_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 .github/scripts/review_gate.py verify --pr "$PR_NUMBER"
  tooling:
    needs: authorize
    if: needs.authorize.outputs.ready == 'true'
    name: Linux unit tests, lint and documentation
    timeout-minutes: 45
    env:
      NO_MKDOCS_2_WARNING: 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use a fresh native audio prefix for this run
        run: echo "OPENTAG_AUDIO_BUILD_ROOT=$RUNNER_TEMP/opentag-audio-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Install Rust test and media dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev ffmpeg build-essential cmake make nasm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npx tsc --noEmit
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run test:ui
      - run: python3 -m unittest discover -s .github/scripts/tests -v
      - run: python3 -m unittest discover -s scripts/tests -p 'test_macos_*.py' -v
      - run: python3 -m unittest discover -s scripts/tests -p 'test_audio*.py' -v
      - name: Check notice collection and AppImage license staging without application builds
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*notices.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_appimage_licenses.py' -v
      - name: Run save acceptance regression suite
        run: python3 -m unittest discover -s scripts/tests -p 'test_save_acceptance.py' -v
      - run: python3 scripts/verify-brand.py
      - run: python3 scripts/audio-deps/test_build.py
      - name: Install the pinned user-guide toolchain
        if: hashFiles('mkdocs.yml') != ''
        run: python -m pip install -r docs/site-requirements.txt
      - name: Check documentation publication boundaries and rendered content
        if: hashFiles('mkdocs.yml') != ''
        run: python -m unittest discover -s docs/tests -v
      - name: Check the complete user-guide writing plan
        if: hashFiles('mkdocs.yml') != ''
        run: python scripts/docs-status.py
      - name: Build the user guide strictly
        if: hashFiles('mkdocs.yml') != ''
        run: python -m mkdocs build --strict
