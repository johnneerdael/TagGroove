name: Publish user guide

# Reusable: deploys the Pages artifact built by docs-build.yml. Only the
# current tip of main is published; a run for an older commit (a newer push
# arrived meanwhile) skips so the site never moves backwards.
on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: opentag-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check deployment is still current main
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$GITHUB_SHA" = "$current_sha" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping Pages publication from an older source revision.'
          fi
      - uses: actions/deploy-pages@v4
        if: steps.fresh.outputs.current == 'true'
        id: deployment
