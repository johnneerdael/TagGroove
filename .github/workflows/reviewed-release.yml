name: Reviewed main release
run-name: 'Reviewed release ${{ inputs.source_sha }}'
on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      resume_run_id:
        description: 'Retain completed packages and retry failed desktop UI validation from this release run'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

# Serialize release runs, including manual and tag-triggered runs for the same
# version. A second run must never race a first run's draft or published assets.
# queue: max keeps up to 100 pending runs instead of replacing the pending one,
# so a tag push or manual run cannot displace a merge's release.
concurrency:
  group: opentag-release
  queue: max
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  authorize:
    if: github.ref == 'refs/heads/main' && github.workflow_ref == format('{0}/.github/workflows/reviewed-release.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-24.04
    outputs:
      resume_run_id: ${{ steps.resume.outputs.resume_run_id }}
      resume_artifact_ids: ${{ steps.resume.outputs.resume_artifact_ids }}
      harness_sha: ${{ steps.resume.outputs.harness_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed merged source or evidenced failed-main repair
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ inputs.head_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 .github/scripts/review_gate.py release-check --pr "$PR_NUMBER"
      - name: Validate retained release packages before native-only recovery
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 .github/scripts/release_resume.py
  prepare:
    needs: authorize
    name: Validate version, tag and source commit
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      # True when this version is already published from this commit (rerun).
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve immutable release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty for main pushes: the version is derived from first-parent history.
          RELEASE_TAG: ''
          REQUESTED_PRERELEASE: 'false'
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: 'false'
        run: node scripts/release.mjs prepare
      - name: Validate Apple notarization credentials before platform builds
        if: steps.plan.outputs.skip != 'true' && needs.authorize.outputs.resume_run_id == ''
        env:
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: node scripts/notary-preflight.mjs

  native-validation:
    name: Native UI and Android integration
    needs: [authorize, prepare]
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/_reviewed-native.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha }}
      source_sha: ${{ inputs.source_sha }}
      harness_sha: ${{ needs.authorize.outputs.harness_sha }}
      skip_android: ${{ needs.authorize.outputs.resume_run_id != '' }}

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: [authorize, prepare]
    if: needs.prepare.outputs.skip != 'true' && needs.authorize.outputs.resume_run_id == ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.platform == 'windows-x64' && vars.CLOUDRUNNER_WINDOWS_ENABLED == 'true' && fromJSON('["self-hosted","windows","x64","cloudrunner","taggroove"]') || matrix.runner }}
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use a fresh native audio prefix for this run
        shell: bash
        run: echo "OPENTAG_AUDIO_BUILD_ROOT=$RUNNER_TEMP/opentag-audio-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          install: make
          update: false
      - name: Bind the installed MSYS2 build tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          foreach ($tool in @('usr/bin/bash.exe', 'usr/bin/make.exe')) {
            if (-not (Test-Path (Join-Path $env:MSYS2_LOCATION $tool))) { throw "MSYS2 tool missing: $tool" }
          }
          "OPENTAG_MSYS2=$env:MSYS2_LOCATION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # Stamp after the caches compute their keys so every release reuses them.
      - name: Stamp release version (not committed)
        run: node scripts/release.mjs stamp
      - name: Linux build and media dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential cmake make nasm
      - name: macOS media dependencies
        if: runner.os == 'macOS'
        run: brew install cmake nasm
      - name: Windows native assembler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nasmDirectory = Join-Path $env:ProgramFiles 'NASM'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nasm --no-progress -y
            if (Test-Path (Join-Path $nasmDirectory 'nasm.exe')) { break }
            Start-Sleep -Seconds (15 * $attempt)
          }
          if (-not (Test-Path (Join-Path $nasmDirectory 'nasm.exe'))) { throw "NASM installation missing (Chocolatey exit code $LASTEXITCODE)" }
          $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $global:LASTEXITCODE = 0
      - run: npm ci
      - name: Prepare AppImage shared license material and inspector
        if: runner.os == 'Linux'
        run: python scripts/appimage-licenses.py --stage --prepare-inspector
      - name: Prepare pinned Linux packaging inputs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          architecture="$(dpkg --print-architecture)"
          case "$architecture" in
            amd64) inspector_arch=x86_64 ;;
            arm64) inspector_arch=aarch64 ;;
            *) exit 1 ;;
          esac
          inspector_version="$(python -c 'import json; print(json.load(open("src/licenses/appimage-common/SOURCES.json"))["inspector"]["version"])')"
          python scripts/linux-build-tools.py --architecture "$architecture" --inspector "target/appimage-inspector-$inspector_version-$inspector_arch/7zz"
          echo "XDG_CACHE_HOME=$GITHUB_WORKSPACE/target/linux-source-tools/xdg-cache" >> "$GITHUB_ENV"
          echo "LDAI_RUNTIME_FILE=$GITHUB_WORKSPACE/target/linux-source-tools/$architecture/runtime" >> "$GITHUB_ENV"
      # No releaseId or tagName: this action builds only. Nothing is published
      # until the single final job validates every required platform artifact.
      - name: Prepare private macOS signing inputs
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          python scripts/macos-release.py prepare --directory "$RUNNER_TEMP/taggroove-macos-notary"
          echo "$RUNNER_TEMP/taggroove-macos-notary" >> "$GITHUB_PATH"
      - name: Build signed and notarized macOS packages
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/taggroove-macos-notary/AuthKey.p8
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles app,dmg --config "$RUNNER_TEMP/taggroove-macos-notary/tauri-release.json" --ci
      - name: Verify notarized macOS packages and bind their bytes
        if: runner.os == 'macOS'
        id: macos
        env:
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: python scripts/macos-release.py verify-built --target '${{ matrix.target }}' --source-commit "$RELEASE_COMMIT" --version '${{ needs.prepare.outputs.version }}' --directory "$RUNNER_TEMP/taggroove-macos-notary" --github-output "$GITHUB_OUTPUT"
      - name: Build desktop packages
        if: runner.os != 'macOS'
        id: tauri
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: false
      - name: Verify AppImage copyright license references
        if: runner.os == 'Linux'
        run: python scripts/appimage-licenses.py --verify-built '${{ matrix.target }}'
      - name: Capture authenticated Linux package and source bindings
        if: runner.os == 'Linux'
        shell: bash
        run: |
          architecture="$(dpkg --print-architecture)"
          case "$architecture" in
            amd64) inspector_arch=x86_64 ;;
            arm64) inspector_arch=aarch64 ;;
            *) exit 1 ;;
          esac
          inspector_version="$(python -c 'import json; print(json.load(open("src/licenses/appimage-common/SOURCES.json"))["inspector"]["version"])')"
          image="$(python -c 'from pathlib import Path; files=list(Path("target/${{ matrix.target }}/release/bundle/appimage").glob("*.AppImage")); assert len(files)==1, "Expected one built AppImage"; print(files[0].resolve())')"
          python scripts/linux-distribution-capture.py --platform "$RELEASE_PLATFORM" --source-commit "$RELEASE_COMMIT" --version '${{ needs.prepare.outputs.version }}' --image "$image" --inspector "target/appimage-inspector-$inspector_version-$inspector_arch/7zz" --strip "target/linux-source-tools/$architecture/strip" --patchelf "target/linux-source-tools/$architecture/patchelf" --output linux-source-evidence
          mkdir -p release-assets
          cp "linux-source-evidence/linux-source-$RELEASE_PLATFORM.json" release-assets/
      - name: Verify Windows installer helper notice bindings
        if: runner.os == 'Windows'
        run: python scripts/component-notices.py --check --built-platform windows
      - name: Check macOS document types (Finder Open With)
        if: runner.os == 'macOS'
        run: |
          product="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).productName")"
          plutil -convert json -o "$RUNNER_TEMP/info.json" "target/${{ matrix.target }}/release/bundle/macos/$product.app/Contents/Info.plist"
          # shellcheck disable=SC2016
          node -e '
            const types = require(process.argv[1]).CFBundleDocumentTypes || [];
            const ext = types.flatMap(t => t.CFBundleTypeExtensions || []), uti = types.flatMap(t => t.LSItemContentTypes || []);
            for (const x of ["flac", "ogg", "opus", "dsf", "ape", "wv", "m3u8", "cue"]) if (!ext.includes(x)) throw new Error(`.${x} missing`);
            for (const x of ["public.audio", "public.folder"]) if (!uti.includes(x)) throw new Error(`${x} missing`);
            // macOS ignores extensions in an entry that also lists content types.
            if (types.some(t => t.CFBundleTypeExtensions && t.LSItemContentTypes)) throw new Error("mixed document type");
            if (types.some(t => t.LSHandlerRank !== "Alternate")) throw new Error("TagGroove must not claim the default handler");
            console.log(JSON.stringify(types, null, 1));
          ' "$RUNNER_TEMP/info.json"
      - name: Name and hash desktop artifacts
        shell: bash
        env:
          TAURI_ARTIFACT_PATHS: ${{ runner.os == 'macOS' && steps.macos.outputs.artifact_paths || steps.tauri.outputs.artifactPaths }}
        run: |
          python scripts/audio-source-bundle.py --collect-native '${{ matrix.target }}' --native-evidence "$OPENTAG_AUDIO_BUILD_ROOT" --source-sha "$RELEASE_COMMIT" --version '${{ needs.prepare.outputs.version }}' --output "release-assets/native-$RELEASE_PLATFORM.json"
          node scripts/release.mjs collect-desktop
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: linux-source-${{ matrix.platform }}
          path: linux-source-evidence/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: macos-signing-${{ matrix.platform }}
          path: release-assets/macos-signing-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: native-source-${{ matrix.platform }}
          path: release-assets/native-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove private macOS signing inputs
        if: always() && runner.os == 'macOS'
        run: python scripts/macos-release.py cleanup --directory "$RUNNER_TEMP/taggroove-macos-notary"

  android:
    name: Android arm64 signed release APK
    needs: [authorize, prepare]
    if: needs.prepare.outputs.skip != 'true' && needs.authorize.outputs.resume_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use a fresh native audio prefix for this run
        shell: bash
        run: echo "OPENTAG_AUDIO_BUILD_ROOT=$RUNNER_TEMP/opentag-audio-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native audio build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake make
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # v3 defaults include the retired SDK "tools" package.
          packages: platform-tools
          # API 37 uses minor-versioned platforms and requires tools 22+.
          cmdline-tools-version: '15859902'
      - name: Install Android platform, build tools and NDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/taggroove-release.keystore" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android-arm64
      # Stamp after the caches compute their keys so every release reuses them.
      - name: Stamp release version (not committed)
        run: node scripts/release.mjs stamp
      - run: npm ci
      - name: Restore application signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/release.mjs restore-android-key
      - name: Build signed arm64 release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Tauri forwards this alias across the IDE build environment.
          export TAURI_OPENTAG_AUDIO_BUILD_ROOT="$OPENTAG_AUDIO_BUILD_ROOT"
          npm run tauri -- android build --target aarch64 --apk --ci
      - name: Verify bundled Android notices against resolved runtime archives
        run: |
          python scripts/android-notices.py --capture "$RUNNER_TEMP/taggroove-android-runtime.json"
          python scripts/android-notices.py --check --metadata "$RUNNER_TEMP/taggroove-android-runtime.json" --verify-material --maven-cache "$HOME/.gradle/caches/modules-2/files-2.1"
          python scripts/component-notices.py --check --built-platform android --ndk "$NDK_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: android-runtime-notice-evidence
          path: ${{ runner.temp }}/taggroove-android-runtime.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify APK signature, version and ABI, then collect
        run: |
          python scripts/audio-source-bundle.py --collect-native aarch64-linux-android --native-evidence "$OPENTAG_AUDIO_BUILD_ROOT" --source-sha "$RELEASE_COMMIT" --version '${{ needs.prepare.outputs.version }}' --output release-assets/native-android-arm64.json
          node scripts/release.mjs collect-android
      - uses: actions/upload-artifact@v4
        with:
          name: native-source-android-arm64
          path: release-assets/native-android-arm64.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS arm64 simulator preview (debug, unsigned)
    needs: [authorize, prepare]
    if: needs.prepare.outputs.skip != 'true' && needs.authorize.outputs.resume_run_id == ''
    runs-on: macos-15
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use a fresh native audio prefix for this run
        shell: bash
        run: echo "OPENTAG_AUDIO_BUILD_ROOT=$RUNNER_TEMP/opentag-audio-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-ios-arm64-simulator
      # Stamp after the caches compute their keys so every release reuses them.
      - name: Stamp release version (not committed)
        run: node scripts/release.mjs stamp
      - name: Install Xcode project generator
        run: brew install xcodegen cmake
      - run: npm ci
      - name: Build simulator app (not a physical-device installer)
        run: |
          # Tauri forwards this alias across the IDE build environment.
          export TAURI_OPENTAG_AUDIO_BUILD_ROOT="$OPENTAG_AUDIO_BUILD_ROOT"
          npm run tauri -- ios build --target aarch64-sim --debug --no-sign --ci
      - name: Verify simulator platform and package app
        run: |
          python scripts/audio-source-bundle.py --collect-native aarch64-apple-ios-sim --native-evidence "$OPENTAG_AUDIO_BUILD_ROOT" --source-sha "$RELEASE_COMMIT" --version '${{ needs.prepare.outputs.version }}' --output release-assets/native-ios-arm64-simulator-preview.json
          node scripts/release.mjs collect-ios
      - uses: actions/upload-artifact@v4
        with:
          name: native-source-ios-arm64-simulator-preview
          path: release-assets/native-ios-arm64-simulator-preview.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios-arm64-simulator-preview
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  corresponding-source:
    name: Assemble complete corresponding source
    needs: [authorize, prepare, desktop, android, ios]
    if: needs.prepare.outputs.skip != 'true' && needs.authorize.outputs.resume_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use trusted main source tooling (also on failed-job retries)
        uses: actions/checkout@v4
        with:
          ref: main
          path: .release-tools
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp source version and build matching frontend
        run: |
          node scripts/release.mjs stamp "$RELEASE_VERSION"
          npm ci
          npm run build
      - uses: actions/download-artifact@v4
        with:
          pattern: native-source-*
          path: native-evidence
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-source-*
          path: linux-evidence
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-signing-*
          path: macos-evidence
          merge-multiple: true
      - name: Package and independently verify complete source
        run: |
          mkdir -p release-assets
          python .release-tools/scripts/audio-source-bundle.py --root "$GITHUB_WORKSPACE" --source-sha "$RELEASE_COMMIT" --version "$RELEASE_VERSION" --native-evidence native-evidence --linux-evidence linux-evidence --macos-evidence macos-evidence --output "release-assets/TagGroove-$RELEASE_TAG-sources.tar.xz"
          python .release-tools/scripts/audio-source-bundle.py --root "$GITHUB_WORKSPACE" --source-sha "$RELEASE_COMMIT" --version "$RELEASE_VERSION" --native-evidence native-evidence --linux-evidence linux-evidence --macos-evidence macos-evidence --verify "release-assets/TagGroove-$RELEASE_TAG-sources.tar.xz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-corresponding-source
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete verified release
    needs: [authorize, prepare, desktop, android, ios, corresponding-source, native-validation]
    if: >-
      always() && !cancelled() && needs.authorize.result == 'success' && needs.prepare.result == 'success' &&
      needs.prepare.outputs.skip != 'true' && needs.native-validation.result == 'success' &&
      (needs.authorize.outputs.resume_run_id != '' ||
       (needs.desktop.result == 'success' && needs.android.result == 'success' &&
        needs.ios.result == 'success' && needs.corresponding-source.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      issues: read
      actions: read
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp release version (not committed)
        run: node scripts/release.mjs stamp
      - uses: actions/download-artifact@v4
        if: needs.authorize.outputs.resume_run_id == ''
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.authorize.outputs.resume_run_id != ''
        with:
          run-id: ${{ needs.authorize.outputs.resume_run_id }}
          github-token: ${{ github.token }}
          artifact-ids: ${{ needs.authorize.outputs.resume_artifact_ids }}
          path: release-assets
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .trusted-gate
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck review before publishing any release
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ inputs.head_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 .trusted-gate/.github/scripts/review_gate.py release-check --pr "$PR_NUMBER"
          echo "tool_sha=$(git -C .trusted-gate rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Recheck retained artifact identities before recovered publication
        if: needs.authorize.outputs.resume_run_id != ''
        working-directory: .trusted-gate
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ needs.authorize.outputs.resume_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_ARTIFACT_IDS: ${{ needs.authorize.outputs.resume_artifact_ids }}
        run: |
          output="$RUNNER_TEMP/native-recovery-final.txt"
          touch "$output"
          GITHUB_OUTPUT="$output" python3 .github/scripts/release_resume.py
          test "$(sed -n 's/^resume_artifact_ids=//p' "$output")" = "$EXPECTED_ARTIFACT_IDS"
      - name: Verify all platforms, calculate SHA256SUMS, upload draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERIFIER_REF: ${{ steps.trusted.outputs.tool_sha }}
          RELEASE_RESUME_RUN: ${{ needs.authorize.outputs.resume_run_id }}
          RELEASE_NATIVE_HARNESS_REF: ${{ needs.authorize.outputs.harness_sha }}
        run: node .trusted-gate/scripts/release.mjs publish

  user-guide:
    needs: authorize
    if: needs.authorize.outputs.resume_run_id == ''
    # Publish reviewed documentation even when no application release is needed.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/_reviewed-pages.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha }}
      source_sha: ${{ inputs.source_sha }}
