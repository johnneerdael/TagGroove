name: Reviewed main release
run-name: 'Reviewed release ${{ inputs.source_sha }}'
on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      source_sha:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

# Serialize release runs, including manual and tag-triggered runs for the same
# version. A second run must never race a first run's draft or published assets.
# queue: max keeps up to 100 pending runs instead of replacing the pending one,
# so a tag push or manual run cannot displace a merge's release.
concurrency:
  group: opentag-release
  queue: max
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  authorize:
    if: github.ref == 'refs/heads/main' && github.workflow_ref == format('{0}/.github/workflows/reviewed-release.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Require clean merged-PR review and validated identical source tree
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ inputs.head_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 .github/scripts/review_gate.py release-check --pr "$PR_NUMBER"
  prepare:
    needs: authorize
    name: Validate version, tag and source commit
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      # True when this version is already published from this commit (rerun).
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/release.test.mjs
      - name: Resolve immutable release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty for main pushes: the version is derived from first-parent history.
          RELEASE_TAG: ''
          REQUESTED_PRERELEASE: 'false'
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: 'false'
        run: node scripts/release.mjs prepare

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # Stamp after the caches compute their keys so every release reuses them.
      - name: Stamp release version (not committed)
        run: node scripts/release.mjs stamp
      - name: Linux build and media dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev ffmpeg
      - name: macOS media dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows media dependencies
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # No releaseId or tagName: this action builds only. Nothing is published
      # until the single final job validates every required platform artifact.
      - name: Build desktop packages
        id: tauri
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: false
      - name: Name and hash desktop artifacts
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: node scripts/release.mjs collect-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android arm64 signed release APK
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # v3 defaults include the retired SDK "tools" package.
          packages: platform-tools
          # API 37 uses minor-versioned platforms and requires tools 22+.
          cmdline-tools-version: '15859902'
      - name: Install Android platform, build tools and NDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/opentag-release.keystore" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android-arm64
      # Stamp after the caches compute their keys so every release reuses them.
      - name: Stamp release version (not committed)
        run: node scripts/release.mjs stamp
      - run: npm ci
      - run: npm run test:ui
      - name: Restore application signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/release.mjs restore-android-key
      - name: Build signed arm64 release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run tauri -- android build --target aarch64 --apk --ci
      - name: Verify APK signature, version and ABI, then collect
        run: node scripts/release.mjs collect-android
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS arm64 simulator preview (debug, unsigned)
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-ios-arm64-simulator
      # Stamp after the caches compute their keys so every release reuses them.
      - name: Stamp release version (not committed)
        run: node scripts/release.mjs stamp
      - name: Install Xcode project generator
        run: brew install xcodegen
      - run: npm ci
      - run: npm run test:ui
      - name: Build simulator app (not a physical-device installer)
        run: npm run tauri -- ios build --target aarch64-sim --debug --no-sign --ci
      - name: Verify simulator platform and package app
        run: node scripts/release.mjs collect-ios
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios-arm64-simulator-preview
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete verified release
    needs: [prepare, desktop, android, ios]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      issues: read
      actions: read
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp release version (not committed)
        run: node scripts/release.mjs stamp
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .trusted-gate
          persist-credentials: false
      - name: Recheck review before publishing any release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ inputs.head_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 .trusted-gate/.github/scripts/review_gate.py release-check --pr "$PR_NUMBER"
      - name: Verify all platforms, calculate SHA256SUMS, upload draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish

  user-guide:
    needs: authorize
    # Publish reviewed documentation even when no application release is needed.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/_reviewed-pages.yml
    # Explicit name authorizes the reusable workflow's environment-secret lookup.
    # The actual key exists only in its github-pages deployment environment.
    secrets:
      DOCS_PAGES_DEPLOY_KEY: ${{ secrets.DOCS_PAGES_DEPLOY_KEY }}
    with:
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha }}
      source_sha: ${{ inputs.source_sha }}
