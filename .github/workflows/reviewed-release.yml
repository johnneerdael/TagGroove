name: Reviewed main release
run-name: 'Reviewed release ${{ inputs.source_sha }}'
on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      source_sha:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

# Serialize release runs, including manual and tag-triggered runs for the same
# version. A second run must never race a first run's draft or published assets.
# queue: max keeps up to 100 pending runs instead of replacing the pending one,
# so a tag push or manual run cannot displace a merge's release.
concurrency:
  group: opentag-release
  queue: max
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  authorize:
    if: github.ref == 'refs/heads/main' && github.workflow_ref == format('{0}/.github/workflows/reviewed-release.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Require clean merged-PR review and validated identical source tree
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ inputs.head_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 .github/scripts/review_gate.py release-check --pr "$PR_NUMBER"
  prepare:
    needs: authorize
    name: Validate version, tag and source commit
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      # True when this version is already published from this commit (rerun).
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/release.test.mjs
      - name: Resolve immutable release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty for main pushes: the version is derived from first-parent history.
          RELEASE_TAG: ''
          REQUESTED_PRERELEASE: 'false'
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: 'false'
        run: node scripts/release.mjs prepare

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use a fresh native audio prefix for this run
        shell: bash
        run: echo "OPENTAG_AUDIO_BUILD_ROOT=$RUNNER_TEMP/opentag-audio-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          install: make
          update: false
      - name: Bind the installed MSYS2 build tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          foreach ($tool in @('usr/bin/bash.exe', 'usr/bin/make.exe')) {
            if (-not (Test-Path (Join-Path $env:MSYS2_LOCATION $tool))) { throw "MSYS2 tool missing: $tool" }
          }
          "OPENTAG_MSYS2=$env:MSYS2_LOCATION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # Stamp after the caches compute their keys so every release reuses them.
      - name: Stamp release version (not committed)
        run: node scripts/release.mjs stamp
      - name: Linux build and media dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev ffmpeg build-essential cmake make nasm
      - name: macOS media dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg cmake nasm
      - name: Windows media dependencies and native assembler
        if: runner.os == 'Windows'
        shell: pwsh
        # Chocolatey's ffmpeg package can transiently fail; retry, then fall back to a pinned build.
        run: |
          $nasmDirectory = Join-Path $env:ProgramFiles 'NASM'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg nasm --no-progress -y
            if ((Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Test-Path (Join-Path $nasmDirectory 'nasm.exe'))) { break }
            Write-Host "ffmpeg or NASM not installed by Chocolatey (attempt $attempt)"
            Start-Sleep -Seconds (15 * $attempt)
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            # Chocolatey unavailable: fall back to the FFmpeg builds on GitHub.
            $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
            # Pin a month-end build (retained upstream for two years) and fail closed on replacement.
            $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-N-127021-ge0c94b2d1c-win64-gpl.zip'
            $expectedSha256 = '85c4a4636b93d681a07588ffa6f1d8f5c064d9c3fb0622066662906b6fd718a1'
            Invoke-WebRequest $url -OutFile $zip -MaximumRetryCount 5 -RetryIntervalSec 10
            $actualSha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) { throw "FFmpeg archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256" }
            Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'ffmpeg')
            $bin = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'ffmpeg') -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
            if (-not $bin) { throw 'FFmpeg executable missing from verified archive' }
            Add-Content $env:GITHUB_PATH $bin
            $env:PATH = "$bin;$env:PATH" # this step only; GITHUB_PATH above carries it to later steps
          }
          if (-not (Test-Path (Join-Path $nasmDirectory 'nasm.exe'))) { throw "NASM installation missing (Chocolatey exit code $LASTEXITCODE)" }
          $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # GitHub's pwsh wrapper ends the step with `exit $LASTEXITCODE`; forget a retried Chocolatey failure once ffmpeg and NASM are verified.
          $global:LASTEXITCODE = 0
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # No releaseId or tagName: this action builds only. Nothing is published
      # until the single final job validates every required platform artifact.
      - name: Build desktop packages
        id: tauri
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: false
      - name: Name and hash desktop artifacts
        shell: bash
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          python scripts/audio-source-bundle.py --collect-native '${{ matrix.target }}' --native-evidence "$OPENTAG_AUDIO_BUILD_ROOT" --source-sha "$RELEASE_COMMIT" --version '${{ needs.prepare.outputs.version }}' --output "release-assets/native-$RELEASE_PLATFORM.json"
          node scripts/release.mjs collect-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: native-source-${{ matrix.platform }}
          path: release-assets/native-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android arm64 signed release APK
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use a fresh native audio prefix for this run
        shell: bash
        run: echo "OPENTAG_AUDIO_BUILD_ROOT=$RUNNER_TEMP/opentag-audio-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native audio build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake make
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # v3 defaults include the retired SDK "tools" package.
          packages: platform-tools
          # API 37 uses minor-versioned platforms and requires tools 22+.
          cmdline-tools-version: '15859902'
      - name: Install Android platform, build tools and NDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/opentag-release.keystore" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake make
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android-arm64
      # Stamp after the caches compute their keys so every release reuses them.
      - name: Stamp release version (not committed)
        run: node scripts/release.mjs stamp
      - run: npm ci
      - run: npm run test:ui
      - name: Restore application signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/release.mjs restore-android-key
      - name: Build signed arm64 release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run tauri -- android build --target aarch64 --apk --ci
      - name: Verify APK signature, version and ABI, then collect
        run: |
          python scripts/audio-source-bundle.py --collect-native aarch64-linux-android --native-evidence "$OPENTAG_AUDIO_BUILD_ROOT" --source-sha "$RELEASE_COMMIT" --version '${{ needs.prepare.outputs.version }}' --output release-assets/native-android-arm64.json
          node scripts/release.mjs collect-android
      - uses: actions/upload-artifact@v4
        with:
          name: native-source-android-arm64
          path: release-assets/native-android-arm64.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS arm64 simulator preview (debug, unsigned)
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use a fresh native audio prefix for this run
        shell: bash
        run: echo "OPENTAG_AUDIO_BUILD_ROOT=$RUNNER_TEMP/opentag-audio-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-ios-arm64-simulator
      # Stamp after the caches compute their keys so every release reuses them.
      - name: Stamp release version (not committed)
        run: node scripts/release.mjs stamp
      - name: Install Xcode project generator
        run: brew install xcodegen cmake
      - run: npm ci
      - run: npm run test:ui
      - name: Build simulator app (not a physical-device installer)
        run: npm run tauri -- ios build --target aarch64-sim --debug --no-sign --ci
      - name: Verify simulator platform and package app
        run: |
          python scripts/audio-source-bundle.py --collect-native aarch64-apple-ios-sim --native-evidence "$OPENTAG_AUDIO_BUILD_ROOT" --source-sha "$RELEASE_COMMIT" --version '${{ needs.prepare.outputs.version }}' --output release-assets/native-ios-arm64-simulator-preview.json
          node scripts/release.mjs collect-ios
      - uses: actions/upload-artifact@v4
        with:
          name: native-source-ios-arm64-simulator-preview
          path: release-assets/native-ios-arm64-simulator-preview.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios-arm64-simulator-preview
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  corresponding-source:
    name: Assemble complete corresponding source
    needs: [prepare, desktop, android, ios]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp source version and build matching frontend
        run: |
          node scripts/release.mjs stamp "$RELEASE_VERSION"
          npm ci
          npm run build
      - uses: actions/download-artifact@v4
        with:
          pattern: native-source-*
          path: native-evidence
          merge-multiple: true
      - name: Package and independently verify complete source
        run: |
          mkdir -p release-assets
          python scripts/audio-source-bundle.py --source-sha "$RELEASE_COMMIT" --version "$RELEASE_VERSION" --native-evidence native-evidence --output "release-assets/OpenTag-$RELEASE_TAG-sources.tar.xz"
          python scripts/audio-source-bundle.py --source-sha "$RELEASE_COMMIT" --version "$RELEASE_VERSION" --native-evidence native-evidence --verify "release-assets/OpenTag-$RELEASE_TAG-sources.tar.xz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-corresponding-source
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete verified release
    needs: [prepare, desktop, android, ios, corresponding-source]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      issues: read
      actions: read
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp release version (not committed)
        run: node scripts/release.mjs stamp
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .trusted-gate
          persist-credentials: false
      - name: Recheck review before publishing any release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ inputs.head_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 .trusted-gate/.github/scripts/review_gate.py release-check --pr "$PR_NUMBER"
      - name: Verify all platforms, calculate SHA256SUMS, upload draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish

  user-guide:
    needs: authorize
    # Publish reviewed documentation even when no application release is needed.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/_reviewed-pages.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha }}
      source_sha: ${{ inputs.source_sha }}
