name: Review metadata signal
# Review events no longer wake the controller. Run the controller by hand when a
# PR is ready to merge: gh workflow run review-controller.yml --ref main -f pr_number=N
on:
  workflow_dispatch:
permissions: {}
jobs:
  signal:
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Metadata changed; trusted main controller must authorize application execution.'
