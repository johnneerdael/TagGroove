name: Review comment invalidation
on:
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: opentag-review-invalidation-${{ github.event.issue.number }}
  queue: max
  cancel-in-progress: false
jobs:
  invalidate:
    # Gate only review requests and connector metadata, including edits away
    # from a request. Ordinary discussion never starts this metadata job.
    if: >-
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '@codex') ||
       contains(github.event.changes.body.from, '@codex') ||
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Withdraw stale approval without dispatching builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/review_gate.py invalidate-comment
