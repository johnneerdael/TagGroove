name: User guide build

# Reusable: builds the MkDocs user guide strictly (broken links, missing
# images and unknown anchors fail the build). Callers choose whether the
# result is uploaded as the Pages artifact.
on:
  workflow_call:
    inputs:
      pages_artifact:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Material prints a long notice about MkDocs 2.0 on every build.
      NO_MKDOCS_2_WARNING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/site-requirements.txt
      - run: python -m pip install -r docs/site-requirements.txt
      - name: Check publication boundaries
        run: python -m unittest discover -s docs/tests -v
      - name: Check the complete writing plan
        run: python scripts/docs-status.py
      - name: Build published pages strictly
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: inputs.pages_artifact
        with:
          path: build/user-guide-site
