name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf ffmpeg
      - name: macOS media fixtures
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows media fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        # Chocolatey's feed sometimes answers 5xx and the install silently
        # does nothing; retry, then require a working ffmpeg.
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --no-progress -y
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            Write-Host "ffmpeg not installed (attempt $attempt); retrying"
            Start-Sleep -Seconds (20 * $attempt)
          }
          ffmpeg -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg is not available' }
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run tauri build
      - name: Check macOS document types (Finder Open With)
        if: runner.os == 'macOS'
        run: |
          plutil -convert json -o "$RUNNER_TEMP/info.json" target/release/bundle/macos/OpenTag.app/Contents/Info.plist
          node -e '
            const types = require(process.argv[1]).CFBundleDocumentTypes || [];
            const ext = types.flatMap(t => t.CFBundleTypeExtensions || []), uti = types.flatMap(t => t.LSItemContentTypes || []);
            for (const x of ["flac", "ogg", "opus", "dsf", "ape", "wv", "m3u8", "cue"]) if (!ext.includes(x)) throw new Error(`.${x} missing`);
            for (const x of ["public.audio", "public.folder"]) if (!uti.includes(x)) throw new Error(`${x} missing`);
            // macOS ignores extensions in an entry that also lists content types.
            if (types.some(t => t.CFBundleTypeExtensions && t.LSItemContentTypes)) throw new Error("mixed document type");
            if (types.some(t => t.LSHandlerRank !== "Alternate")) throw new Error("OpenTag must not claim the default handler");
            console.log(JSON.stringify(types, null, 1));
          ' "$RUNNER_TEMP/info.json"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTag-${{ matrix.os }}
          path: target/release/bundle/
  native-e2e:
    name: Native UI workflows (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-e2e
      - name: Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf ffmpeg xvfb xauth dbus-x11
      - name: macOS media fixtures
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows media fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        # Chocolatey's feed sometimes answers 5xx and the install silently
        # does nothing; retry, then require a working ffmpeg.
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --no-progress -y
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            Write-Host "ffmpeg not installed (attempt $attempt); retrying"
            Start-Sleep -Seconds (20 * $attempt)
          }
          ffmpeg -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg is not available' }
      - run: npm ci
      - name: Build the debug app once
        run: |
          # macOS runs the binary inside the .app bundle; it carries the test identifier.
          if [[ "$RUNNER_OS" == macOS ]]; then bundle="--bundles app"; else bundle="--no-bundle"; fi
          config='{"identifier":"org.opentag.editor.usertest","productName":"OpenTag UserTest"}'
          if [[ "$RUNNER_OS" != Linux ]]; then
            config='{"identifier":"org.opentag.editor.usertest","productName":"OpenTag UserTest","app":{"windows":[{"title":"OpenTag","width":1240,"height":800,"minWidth":800,"minHeight":560,"backgroundThrottling":"disabled"}]}}'
          fi
          npx tauri build --debug $bundle --config "$config"
      - name: Run native suites
        run: |
          set -o pipefail
          mkdir -p e2e-output
          # Linux has no display: xvfb plus a session bus for single-instance
          # forwarding. macOS and Windows runners have a desktop session.
          if [[ "$RUNNER_OS" == Linux ]]; then run=(dbus-run-session -- xvfb-run -a); else run=(); fi
          status=0
          for suite in core-workflows covers actions options-utils playlists freedb-local formats-3 general-options remove-mapping list-behaviour rename-fixes keyboard-extended script-export actions-polish sources-3 keyboard-ui launch-forwarding export-lists chapters web-sources formats-edge panel-dock chapter-fields library i18n; do
            fixtures=""
            [[ -x "tests/e2e/$suite-fixtures.sh" ]] && fixtures="$PWD/tests/e2e/$suite-fixtures.sh"
            echo "::group::$suite"
            if ! OPENTAG_E2E_OFFLINE=1 OPENTAG_E2E_FIXTURES="$fixtures" "${run[@]}" scripts/e2e-native.sh "tests/e2e/$suite.js" --no-build 2>&1 | tee "e2e-output/$suite.txt"; then
              echo "::error::Native suite $suite failed on $RUNNER_OS"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-output-${{ matrix.os }}
          path: e2e-output/
  android:
    name: Android document integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '15859902'
      - name: Install Android build dependencies
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-document-integration
      - run: npm ci
      - run: npm run test:ui
      - name: Build debug arm64 app without release credentials
        run: npm run tauri -- android build --debug --target aarch64 --apk --ci
      - name: Test native viewport, document transport and grant policy
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:testArm64DebugUnitTest :tauri-plugin-document-access:testDebugUnitTest --console=plain
      - name: Retain Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenTag-android-document-tests
          path: |
            crates/document-access/android/build/test-results/
            src-tauri/gen/android/app/build/test-results/testArm64DebugUnitTest/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTag-android-arm64-debug
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
