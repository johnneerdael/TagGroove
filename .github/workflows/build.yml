name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf ffmpeg
      - name: macOS media fixtures
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows media fixtures
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTag-${{ matrix.os }}
          path: target/release/bundle/
  native-e2e:
    name: Native UI workflows (headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-e2e
      - name: Linux UI dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf ffmpeg xvfb xauth dbus-x11
      - run: npm ci
      - name: Build the debug app once
        run: |
          npx tauri build --debug --no-bundle \
            --config '{"identifier":"org.opentag.editor.usertest","productName":"OpenTag UserTest"}'
      - name: Run native suites under xvfb
        run: |
          set -o pipefail
          mkdir -p e2e-output
          status=0
          for suite in core-workflows covers actions options-utils playlists freedb-local formats-3 general-options remove-mapping list-behaviour rename-fixes keyboard-extended script-export actions-polish sources-3 keyboard-ui export-lists; do
            fixtures=""
            [[ -x "tests/e2e/$suite-fixtures.sh" ]] && fixtures="$PWD/tests/e2e/$suite-fixtures.sh"
            echo "::group::$suite"
            if ! OPENTAG_E2E_OFFLINE=1 OPENTAG_E2E_FIXTURES="$fixtures" dbus-run-session -- xvfb-run -a scripts/e2e-native.sh "tests/e2e/$suite.js" --no-build 2>&1 | tee "e2e-output/$suite.txt"; then
              echo "::error::Native suite $suite failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-output
          path: e2e-output/
  android:
    name: Android document integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '15859902'
      - name: Install Android build dependencies
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-document-integration
      - run: npm ci
      - run: npm run test:ui
      - name: Build debug arm64 app without release credentials
        run: npm run tauri -- android build --debug --target aarch64 --apk --ci
      - name: Test native viewport, document transport and grant policy
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:testArm64DebugUnitTest :tauri-plugin-document-access:testDebugUnitTest --console=plain
      - name: Retain Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenTag-android-document-tests
          path: |
            crates/document-access/android/build/test-results/
            src-tauri/gen/android/app/build/test-results/testArm64DebugUnitTest/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTag-android-arm64-debug
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
