name: Review authorization controller
on:
  # Runs only at merge time: a main push (release authorization), the end of a
  # validation it dispatched, or an explicit recheck of one PR. No PR, comment,
  # review or schedule event starts it.
  push:
    branches: [main]
  workflow_run:
    workflows: [Reviewed PR validation]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
        default: ''
      retry_build:
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
  actions: write
concurrency:
  group: opentag-review-controller
  queue: max
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Reconcile metadata and dispatch only approved immutable PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || '0' }}
          RETRY: ${{ inputs.retry_build }}
        run: |
          args=()
          if [ "$RETRY" = true ]; then args+=(--retry); fi
          python3 .github/scripts/review_gate.py reconcile --pr "$PR_NUMBER" "${args[@]}"
      - name: Authorize publication only for a validated merged PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/review_gate.py main
