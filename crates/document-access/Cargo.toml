[package]
name = "tauri-plugin-document-access"
version = "0.1.0"
edition = "2021"
license = "MIT"
links = "tauri-plugin-document-access"
description = "Android Storage Access Framework document grants for OpenTag"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
serde_json = "1"
