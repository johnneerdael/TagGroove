site_name: OpenTag user guide
site_description: Learn to tag, rename, organise and export your music with OpenTag, the open-source audio metadata editor.
site_url: https://johnneerdael.github.io/opentag/
repo_url: https://github.com/johnneerdael/opentag
repo_name: johnneerdael/opentag
edit_uri: edit/main/docs/user-guide/
docs_dir: docs/user-guide
site_dir: build/user-guide-site
copyright: OpenTag is free, open-source software. It is an independent project, compatible with but not affiliated with Mp3tag.

# Writer-only material lives beside the pages but is not published.
exclude_docs: |
  _meta/
  _snippets/

theme:
  name: material
  language: en
  logo: assets/brand/mark.svg
  favicon: assets/brand/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Follow the system setting
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit

extra_css:
  - stylesheets/opentag.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/johnneerdael/opentag
      name: OpenTag on GitHub
  status:
    draft: This page is still being written

hooks:
  - docs/hooks/publication.py

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: docs/user-guide/_snippets
      auto_append:
        - abbreviations.md
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Strict builds (`mkdocs build --strict`) turn every one of these into an error.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
- Home: index.md
- Learn:
  - Tutorials:
    - Your first tagging session: learn/first-tagging-session.md
    - Format strings from zero: learn/format-strings-from-zero.md
    - Rename files and folders: learn/rename-files-and-folders.md
    - Regular expressions from zero: learn/regex-from-zero.md
    - Build your first action group: learn/first-action-group.md
  - Concepts:
    - Multi-value fields: concepts/multi-value-fields.md
    - Text encodings and codepages: concepts/text-encodings.md
- Automate:
  - Converters:
    - converters/index.md
    - Tag → Filename: converters/tag-to-filename.md
    - Filename → Tag: converters/filename-to-tag.md
    - Filename → Filename: converters/filename-to-filename.md
    - Text File → Tag: converters/text-file-to-tag.md
    - Tag → Tag: converters/tag-to-tag.md
    - Auto-numbering: converters/auto-numbering.md
  - Actions:
    - actions/index.md
    - Action types:
      - Adjust cover: actions/adjust-cover.md
      - Case conversion: actions/case-conversion.md
      - Convert codepage: actions/convert-codepage.md
      - Export: actions/export.md
      - Export cover to file: actions/export-cover.md
      - Format value: actions/format-value.md
      - Generate playlists: actions/generate-playlists.md
      - Guess values: actions/guess-values.md
      - Import cover from file: actions/import-cover.md
      - Import text file: actions/import-text-file.md
      - Merge duplicate fields: actions/merge-duplicate-fields.md
      - Remove duplicate fields: actions/remove-duplicate-fields.md
      - Remove fields: actions/remove-fields.md
      - Remove fields except: actions/remove-fields-except.md
      - Replace: actions/replace.md
      - Replace with regular expression: actions/replace-regexp.md
      - Set cover properties: actions/set-cover-properties.md
      - Split field by separator: actions/split-field.md
- Reference:
  - Format strings:
    - Format strings: reference/format-strings.md
    - Placeholders: reference/placeholders.md
    - Scripting functions: reference/scripting/index.md
    - Text and case: reference/scripting/text.md
    - Search and compare: reference/scripting/search-compare.md
    - Conditions and logic: reference/scripting/conditions.md
    - Numbers and maths: reference/scripting/numbers.md
    - Dates and durations: reference/scripting/dates-durations.md
    - Lists, metadata and environment: reference/scripting/lists-metadata.md
  - Regular expressions: reference/regular-expressions.md
- Cookbook:
  - Rename files and folders:
    - Zero-padded track numbers in filenames: cookbook/rename-zero-padded-track-numbers.md
  - Fix and tidy tags:
    - Move “feat.” artists out of the artist field: cookbook/feat-artists-to-title.md
  - Import tags:
    - Tag files from folder and file names: cookbook/tags-from-folder-and-filename.md
