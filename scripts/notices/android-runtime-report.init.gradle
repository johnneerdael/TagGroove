// Metadata task only. Never depend on project artifacts or application build tasks.
import groovy.json.JsonOutput
import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return // Included buildSrc also receives init scripts.
    app.tasks.register('noticeDependencyReport') {
        doLast {
            def destination = app.providers.gradleProperty('noticeReport').get()
            def cfg = app.configurations.getByName('arm64ReleaseRuntimeClasspath')
            def identity = { id ->
                if (id instanceof ModuleComponentIdentifier)
                    return id.group + ':' + id.module + ':' + id.version
                if (id instanceof ProjectComponentIdentifier)
                    return 'project ' + id.projectPath
                throw new GradleException('Unexpected Android component identity: ' + id)
            }
            def components = cfg.incoming.resolutionResult.allComponents.collect { c ->
                [id: identity(c.id), module: c.moduleVersion?.toString(),
                 dependencies: c.dependencies.collect { d ->
                     [requested: d.requested.displayName,
                      selected: d.hasProperty('selected') ? identity(d.selected.id) : null,
                      failure: d.hasProperty('failure') ? d.failure.message : null]
                 }]
            }
            // Project artifact variants can require packaging tasks. Resolve only
            // external runtime archives while retaining project edges above.
            def artifacts = cfg.incoming.artifactView {
                componentFilter { id -> id instanceof ModuleComponentIdentifier }
            }.artifacts.artifacts.collect { a ->
                [component: identity(a.id.componentIdentifier), file: a.file.absolutePath,
                 sha256: MessageDigest.getInstance('SHA-256').digest(a.file.bytes).encodeHex().toString()]
            }
            def projects = gradle.rootProject.allprojects.findAll { it.path != ':' }.collect {
                [name: it.name, directory: it.projectDir.canonicalPath]
            }
            def result = [configuration: cfg.name, components: components, artifacts: artifacts,
                          projects: projects, gradleVersion: gradle.gradleVersion]
            new File(destination).bytes = (JsonOutput.prettyPrint(JsonOutput.toJson(result)) + '\n').getBytes('UTF-8')
            println 'NOTICE_COMPONENTS=' + components.size() + ' ARTIFACTS=' + artifacts.size()
        }
    }
}
